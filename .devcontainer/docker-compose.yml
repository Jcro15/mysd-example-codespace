services:
  # Contenedor donde corre VS Code (Codespaces/Dev Containers lo necesitan).
  # Los estudiantes no interactúan con él directamente.
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    # Mantiene vivo el contenedor de desarrollo
    command: sleep infinity
    # Comparte la red con "db": la base de datos queda disponible en localhost:5432
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: mysd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d mysd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
